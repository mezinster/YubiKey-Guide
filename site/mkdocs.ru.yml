site_name: YubiKey Guide
site_url: https://mezinster.github.io/YubiKey-Guide/ru/
site_description: Использование YubiKey с GnuPG для шифрования, подписи и SSH и восстановление ключей из резервной копии.
repo_url: https://github.com/mezinster/YubiKey-Guide
repo_name: mezinster/YubiKey-Guide
edit_uri: ""
docs_dir: .build-ru  # written by build.py from site/ru; never edit it
site_dir: .site/ru
strict: true

theme:
  name: material
  language: ru
  features:
    - navigation.sections
    - navigation.top
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Включить тёмную тему
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Включить светлую тему

markdown_extensions:
  - admonition
  - attr_list
  - footnotes
  - md_in_html
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tasklist:
      custom_checkbox: true
  - toc:
      permalink: true
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower

plugins:
  - search:
      lang: [ru, en]

validation:
  links:
    not_found: warn
    anchors: warn
    absolute_links: warn
    unrecognized_links: warn

extra:
  alternate:
    - name: English
      link: /YubiKey-Guide/
      lang: en
    - name: Русский
      link: /YubiKey-Guide/ru/
      lang: ru

nav:
  - Главная: index.md
  - Руководство: guide.md
  - Безопасная среда: secenv.md
  - PIV: piv.md
  - Утилита восстановления: recovery.md
  - Загрузка: download.md
