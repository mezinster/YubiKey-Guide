site_name: YubiKey Guide
site_url: https://mezinster.github.io/YubiKey-Guide/
site_description: Using a YubiKey with GnuPG for encryption, signing and SSH, and recovering it from a backup.
repo_url: https://github.com/mezinster/YubiKey-Guide
repo_name: mezinster/YubiKey-Guide
edit_uri: ""
docs_dir: .build  # written by build.py from the repo's Markdown files; never edit it
site_dir: .site
strict: true

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

markdown_extensions:
  - admonition
  - attr_list
  - footnotes
  - md_in_html
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tasklist:
      custom_checkbox: true
  - toc:
      permalink: true
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower

validation:
  links:
    not_found: warn
    anchors: warn
    absolute_links: warn
    unrecognized_links: warn

nav:
  - Home: index.md
  - Guide: guide.md
  - Secure environment: secenv.md
  - PIV: piv.md
  - Recovery tool: recovery.md
  - Download: download.md
