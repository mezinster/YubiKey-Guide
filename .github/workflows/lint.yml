name: lint

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: markdownlint (incl. broken anchor links, MD051)
        run: npx --yes markdownlint-cli2@0.23.3

      - name: table of contents lists all headings
        run: python3 .github/scripts/check_toc.py README.md

      - name: shellcheck
        run: shellcheck --severity=error scripts/*.sh piv/*.sh recovery/recoverCard.sh recovery/tests/fixtures/make_fixtures.sh

  recovery:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: install GnuPG
        run: sudo apt-get update && sudo apt-get install -y gnupg scdaemon

      - name: recovery tests (Python and bash)
        working-directory: recovery
        run: python3 -m unittest discover -s tests -t . -v

  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: install GnuPG
        # Official GnuPG installer, pinned by version and SHA-256 (signature verified against the
        # GnuPG release key 6DAA6E64A76D2840571B4902528897B826403ADA when the pin was set).
        timeout-minutes: 10
        env:
          GNUPG_URL: https://gnupg.org/ftp/gcrypt/binary/gnupg-w32-2.5.24_20260923.exe
          GNUPG_SHA256: EA6F9DEE2CCCD83287432625B8B399173805ADD81D27067FCAF019C0C4DA1AD8
        run: |
          $installer = Join-Path $env:RUNNER_TEMP "gnupg-w32.exe"
          Write-Host "Downloading $env:GNUPG_URL"
          Invoke-WebRequest -Uri $env:GNUPG_URL -OutFile $installer
          $hash = (Get-FileHash $installer -Algorithm SHA256).Hash
          if ($hash -ne $env:GNUPG_SHA256) { throw "GnuPG installer hash mismatch: $hash" }
          Write-Host "Installing GnuPG silently"
          # Wait for the installer process only: Start-Process -Wait in PowerShell 7 also waits for the
          # gpg-agent the installer leaves running, which never exits.
          $process = Start-Process -FilePath $installer -ArgumentList "/S" -PassThru
          if (-not $process.WaitForExit(300000)) { throw "GnuPG installer did not finish within 5 minutes" }
          if ($process.ExitCode -ne 0) { throw "GnuPG installer failed with exit code $($process.ExitCode)" }
          $found = $false
          foreach ($dir in "${env:ProgramFiles(x86)}\GnuPG\bin", "$env:ProgramFiles\GnuPG\bin") {
            if (Test-Path "$dir\gpg.exe") {
              $dir | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
              & "$dir\gpg.exe" --version
              $found = $true
            }
          }
          if (-not $found) { throw "gpg.exe not found after installing GnuPG" }

      - name: install build requirements
        run: python -m pip install -r recovery/packaging/requirements-windows.txt

      - name: recovery tests
        timeout-minutes: 20
        working-directory: recovery
        run: python -m unittest discover -s tests -t . -v

      - name: build executables
        run: recovery/packaging/build-windows.ps1

      - name: smoke test
        run: python recovery/packaging/smoke_test.py recovery/packaging/dist/ykrecover.exe

      - uses: actions/upload-artifact@v4
        with:
          name: ykrecover-windows-x64
          path: recovery/packaging/dist/ykrecover-windows-x64.zip
