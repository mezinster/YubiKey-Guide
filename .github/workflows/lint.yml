name: lint

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: markdownlint (incl. broken anchor links, MD051)
        run: npx --yes markdownlint-cli2@0.23.3

      - name: table of contents lists all headings
        run: python3 .github/scripts/check_toc.py README.md

      - name: shellcheck
        run: shellcheck --severity=error scripts/*.sh piv/*.sh
