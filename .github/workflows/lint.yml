name: lint

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: markdownlint (incl. broken anchor links, MD051)
        run: npx --yes markdownlint-cli2@0.23.3

      - name: table of contents lists all headings
        run: python3 .github/scripts/check_toc.py README.md

      - name: shellcheck
        run: shellcheck --severity=error scripts/*.sh piv/*.sh recovery/recoverCard.sh recovery/tests/fixtures/make_fixtures.sh

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: docs site (unit tests and strict build)
        run: |
          python3 -m unittest discover -s site -v
          pip install -r site/requirements.txt
          python3 site/build.py
          mkdocs build --strict -f site/mkdocs.yml
          mkdocs build --strict -f site/mkdocs.ru.yml
          python3 site/check_ru.py

  recovery:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: install GnuPG, Tk and a virtual display
        run: sudo apt-get update && sudo apt-get install -y gnupg scdaemon python3-tk xvfb

      - name: recovery tests (Python, bash and the GUI)
        working-directory: recovery
        env:
          YKRECOVER_REQUIRE_GUI: "1"  # fail, rather than skip, when the GUI tests cannot run
        run: xvfb-run -a -s "-screen 0 1920x1080x24" python3 -m unittest discover -s tests -t . -v

  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: install GnuPG
        # Pinned official GnuPG for Windows, unpacked where Gpg4win installs it (see the script).
        timeout-minutes: 10
        run: .github/scripts/install-gnupg-windows.ps1

      - name: prepare script (dry run, Windows PowerShell 5.1)
        run: |
          # GnuPG is under Program Files (see "install GnuPG"), so the dry run exercises the "already
          # installed" detection.
          $out = powershell -NoProfile -ExecutionPolicy Bypass -File recovery/packaging/prepare-windows.ps1 -WhatIf
          $code = $LASTEXITCODE
          $out
          if ($code -ne 0) { throw "prepare-windows.ps1 -WhatIf failed with exit code $code" }
          if (-not ($out -match "GnuPG found in")) { throw "the dry run did not detect GnuPG under Program Files" }
          if ($out -match "choco install gnupg") { throw "the dry run would install GnuPG although it is present" }

      - name: install build requirements
        run: python -m pip install -r recovery/packaging/requirements-windows.txt

      - name: recovery tests
        timeout-minutes: 20
        working-directory: recovery
        run: python -m unittest discover -s tests -t . -v

      - name: build executables
        run: recovery/packaging/build-windows.ps1

      - name: smoke test
        run: python recovery/packaging/smoke_test.py recovery/packaging/dist/ykrecover-windows-x64/ykrecover.exe

      - uses: actions/upload-artifact@v4
        with:
          name: ykrecover-windows-x64
          path: recovery/packaging/dist/ykrecover-windows-x64.zip
