name: lint

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: markdownlint (incl. broken anchor links, MD051)
        run: npx --yes markdownlint-cli2@0.23.3

      - name: table of contents lists all headings
        run: python3 .github/scripts/check_toc.py README.md

      - name: shellcheck
        run: shellcheck --severity=error scripts/*.sh piv/*.sh recovery/recoverCard.sh recovery/tests/fixtures/make_fixtures.sh

  recovery:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: install GnuPG
        run: sudo apt-get update && sudo apt-get install -y gnupg scdaemon

      - name: recovery tests (Python and bash)
        working-directory: recovery
        run: python3 -m unittest discover -s tests -t . -v

  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: install GnuPG
        # Official GnuPG for Windows, pinned by version and SHA-256 (signature verified against the GnuPG
        # release key 6DAA6E64A76D2840571B4902528897B826403ADA when the pin was set). The silent installer
        # hangs on headless runners, so unpack its bin\ folder with the preinstalled 7-Zip instead; GnuPG on
        # Windows finds its helper programs relative to gpg.exe.
        timeout-minutes: 10
        env:
          GNUPG_URL: https://gnupg.org/ftp/gcrypt/binary/gnupg-w32-2.5.24_20260923.exe
          GNUPG_SHA256: EA6F9DEE2CCCD83287432625B8B399173805ADD81D27067FCAF019C0C4DA1AD8
        run: |
          $installer = Join-Path $env:RUNNER_TEMP "gnupg-w32.exe"
          $dest = Join-Path $env:RUNNER_TEMP "gnupg"
          Write-Host "Downloading $env:GNUPG_URL"
          Invoke-WebRequest -Uri $env:GNUPG_URL -OutFile $installer
          $hash = (Get-FileHash $installer -Algorithm SHA256).Hash
          if ($hash -ne $env:GNUPG_SHA256) { throw "GnuPG installer hash mismatch: $hash" }
          & "$env:ProgramFiles\7-Zip\7z.exe" x $installer "-o$dest" -y | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "7-Zip could not unpack the GnuPG installer ($LASTEXITCODE)" }
          Remove-Item "$dest\bin\*.tmp" -ErrorAction SilentlyContinue
          foreach ($tool in "gpg", "gpgconf", "gpg-connect-agent", "gpg-agent", "scdaemon") {
            if (-not (Test-Path "$dest\bin\$tool.exe")) { throw "$tool.exe missing from the GnuPG installer" }
          }
          & "$dest\bin\gpg.exe" --version | Select-Object -First 2
          if ($LASTEXITCODE -ne 0) { throw "gpg --version failed" }
          & "$dest\bin\gpgconf.exe" --list-dirs
          "$dest\bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
      - name: prepare script (dry run, Windows PowerShell 5.1)
        run: |
          # Put GnuPG where Gpg4win installs it, so the dry run exercises the "already installed" detection.
          New-Item -ItemType Directory -Force "$env:ProgramFiles\GnuPG" | Out-Null
          Copy-Item -Recurse -Force (Join-Path $env:RUNNER_TEMP "gnupg\bin") "$env:ProgramFiles\GnuPG\"
          $out = powershell -NoProfile -ExecutionPolicy Bypass -File recovery/packaging/prepare-windows.ps1 -WhatIf
          $code = $LASTEXITCODE
          $out
          if ($code -ne 0) { throw "prepare-windows.ps1 -WhatIf failed with exit code $code" }
          if (-not ($out -match "GnuPG found in")) { throw "the dry run did not detect GnuPG under Program Files" }
          if ($out -match "choco install gnupg") { throw "the dry run would install GnuPG although it is present" }

      - name: install build requirements
        run: python -m pip install -r recovery/packaging/requirements-windows.txt

      - name: recovery tests
        timeout-minutes: 20
        working-directory: recovery
        run: python -m unittest discover -s tests -t . -v

      - name: build executables
        run: recovery/packaging/build-windows.ps1

      - name: smoke test
        run: python recovery/packaging/smoke_test.py recovery/packaging/dist/ykrecover.exe

      - uses: actions/upload-artifact@v4
        with:
          name: ykrecover-windows-x64
          path: recovery/packaging/dist/ykrecover-windows-x64.zip
