name: pages

on:
  push:
    branches: [master]
    paths:
      - README.md
      - SECENV.md
      - piv/README.md
      - recovery/README.md
      - media/**
      - site/**
      - .github/workflows/pages.yml
  workflow_dispatch:  # the Actions tab button, and release-windows.yml after a release

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: install mkdocs material
        run: pip install -r site/requirements.txt

      - name: list releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api "repos/${{ github.repository }}/releases" > releases.json

      - name: build
        run: |
          python3 site/build.py --releases releases.json
          mkdocs build --strict -f site/mkdocs.yml
          mkdocs build --strict -f site/mkdocs.ru.yml
          python3 site/check_ru.py

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/.site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
