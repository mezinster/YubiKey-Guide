name: release-windows

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: install GnuPG
        # Official GnuPG installer, pinned by version and SHA-256 (signature verified against the
        # GnuPG release key 6DAA6E64A76D2840571B4902528897B826403ADA when the pin was set).
        timeout-minutes: 10
        env:
          GNUPG_URL: https://gnupg.org/ftp/gcrypt/binary/gnupg-w32-2.5.24_20260923.exe
          GNUPG_SHA256: EA6F9DEE2CCCD83287432625B8B399173805ADD81D27067FCAF019C0C4DA1AD8
        run: |
          $installer = Join-Path $env:RUNNER_TEMP "gnupg-w32.exe"
          Invoke-WebRequest -Uri $env:GNUPG_URL -OutFile $installer
          $hash = (Get-FileHash $installer -Algorithm SHA256).Hash
          if ($hash -ne $env:GNUPG_SHA256) { throw "GnuPG installer hash mismatch: $hash" }
          $process = Start-Process -FilePath $installer -ArgumentList "/S" -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "GnuPG installer failed with exit code $($process.ExitCode)" }
          $found = $false
          foreach ($dir in "${env:ProgramFiles(x86)}\GnuPG\bin", "$env:ProgramFiles\GnuPG\bin") {
            if (Test-Path "$dir\gpg.exe") {
              $dir | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
              & "$dir\gpg.exe" --version
              $found = $true
            }
          }
          if (-not $found) { throw "gpg.exe not found after installing GnuPG" }

      - name: install build requirements
        run: python -m pip install -r recovery/packaging/requirements-windows.txt

      - name: recovery tests
        timeout-minutes: 20
        working-directory: recovery
        run: python -m unittest discover -s tests -t . -v

      - name: build executables
        run: recovery/packaging/build-windows.ps1

      - name: smoke test
        run: python recovery/packaging/smoke_test.py recovery/packaging/dist/ykrecover.exe

      - name: attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release view $env:TAG *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $env:TAG --title $env:TAG --notes "Windows build of the YubiKey recovery tool."
          }
          gh release upload $env:TAG recovery/packaging/dist/ykrecover-windows-x64.zip --clobber
