name: release-windows

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  actions: write  # start pages.yml once the release is ready

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: install GnuPG
        # Pinned official GnuPG for Windows, unpacked where Gpg4win installs it (see the script).
        timeout-minutes: 10
        run: .github/scripts/install-gnupg-windows.ps1

      - name: install build requirements
        run: python -m pip install -r recovery/packaging/requirements-windows.txt

      - name: recovery tests
        timeout-minutes: 20
        working-directory: recovery
        run: python -m unittest discover -s tests -t . -v

      - name: build executables
        run: recovery/packaging/build-windows.ps1

      - name: smoke test
        run: python recovery/packaging/smoke_test.py recovery/packaging/dist/ykrecover-windows-x64/ykrecover.exe

      - name: attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release view $env:TAG *> $null
          if ($LASTEXITCODE -ne 0) {
            $flags = @()
            if ($env:TAG.Contains("-")) { $flags += "--prerelease" }   # v0.1.0-beta and the like
            gh release create $env:TAG --title $env:TAG --notes "Windows build of the YubiKey recovery tool." @flags
          }
          gh release upload $env:TAG recovery/packaging/dist/ykrecover-windows-x64.zip --clobber

      - name: refresh the docs site download page
        continue-on-error: true  # the release is complete; a site that cannot rebuild yet must not fail it
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref master --repo "${{ github.repository }}"
